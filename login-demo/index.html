<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universal Login - Twiller</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <div class="logo">🐦</div>
      <h1 class="title">Twiller Login</h1>
      <p class="subtitle">Sign in with email, Google or Facebook</p>

      <div class="error-box" id="errorBox" hidden></div>
      <div class="success-box" id="successBox" hidden></div>

      <div class="provider-buttons">
        <button class="btn btn-google" id="googleBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <button class="btn btn-facebook" id="facebookBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#1877F2" d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047v-2.66c0-3.025 1.792-4.697 4.533-4.697 1.313 0 2.686.236 2.686.236v2.971H15.83c-1.491 0-1.956.93-1.956 1.886v2.264h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
          </svg>
          Continue with Facebook
        </button>
      </div>

      <div class="divider"><span>or</span></div>

      <div class="mode-tabs">
        <button class="tab active" id="signInTab" type="button">Sign In</button>
        <button class="tab" id="signUpTab" type="button">Sign Up</button>
      </div>

      <form id="authForm" novalidate>
        <div class="field" id="nameField" hidden>
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Your name" autocomplete="name" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>

        <button class="btn btn-primary" id="submitBtn" type="submit">Sign In</button>
      </form>

      <p class="hint" id="modeHint">
        Don't have an account? <button type="button" class="link" id="switchMode">Sign Up</button>
      </p>
    </div>

    <div class="auth-card" id="dashboard" hidden>
      <div class="logo">✅</div>
      <h1 class="title">Welcome!</h1>
      <p class="subtitle">You are signed in as</p>
      <div class="user-box">
        <img id="userAvatar" alt="avatar" />
        <div>
          <p class="user-name" id="userName"></p>
          <p class="user-email" id="userEmail"></p>
        </div>
      </div>
      <button class="btn btn-primary" id="signOutBtn" type="button">Sign Out</button>
    </div>
  </main>

  <!-- Firebase (v9 compat) from CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
